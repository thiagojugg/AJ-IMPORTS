<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080808">
<title>Produto — AJ IMPORTS</title><link rel="stylesheet" href="assets/css/style.css"><script defer src="assets/js/product.js"></script><script defer src="assets/js/shared-header.js"></script>
</head>
<body class="product-page">
<header class="header"><button id="searchBtn" aria-label="Pesquisar">⌕</button><a class="logo" href="index.html"><b>AJ</b><small>IMPORTS</small></a><button id="bagBtn" aria-label="Carrinho de compras">🛒 <sup id="count">0</sup></button></header>
<div id="search" class="search"><input id="searchInput" placeholder="Pesquisar produtos..." autocomplete="off"><button id="closeSearch" aria-label="Fechar pesquisa">×</button><div id="headerSearchResults" class="header-search-results"></div></div>
<div id="shade" class="shade"></div><aside id="drawer" class="drawer"><header><h2>SUA SACOLA</h2><button id="closeBag" aria-label="Fechar sacola">×</button></header><div id="cartItems"></div><div class="total"><b>TOTAL</b><strong id="total">R$ 0,00</strong></div><button id="checkout" class="yellow wide">FINALIZAR PELO WHATSAPP</button></aside>
<main class="detail">
<div class="detail-visual">
<div class="detail-gallery-frame"><div class="detail-gallery-label">AJ IMPORTS <span>•</span> PRODUTO EM DESTAQUE</div><div id="gallery" class="gallery" aria-label="Galeria de fotos"></div></div>

</div>
<section class="detail-content" aria-label="Informações do produto">
<div class="detail-kicker"><span>COLEÇÃO AJ IMPORTS</span><i></i><span>DETALHES</span></div>
<h1 id="name">Produto</h1>
<div class="detail-price-row"><strong id="price" class="detail-price"></strong><span class="detail-availability"><i></i> DISPONÍVEL</span></div>
<p id="description" class="detail-description"></p>
<div class="detail-option variant-option"><div class="option-heading"><h3>01 — VARIEDADES</h3><span id="variant-current">ESCOLHA UMA OPÇÃO</span></div><div id="variants" class="option-list variant-squares" aria-label="Escolha uma variedade"></div></div>
<div class="detail-option"><div class="option-heading"><h3>02 — TAMANHO</h3><span>SELECIONE ABAIXO</span></div><div id="sizes" class="option-list"></div></div>
<div class="detail-purchase-row">
<label class="quantity-control"><span>QUANTIDADE</span><input id="qty" type="number" min="1" value="1" inputmode="numeric" aria-label="Quantidade"></label>
<span class="detail-secure">COMPRA DIRETA<br>VIA WHATSAPP</span>
</div>
<div class="detail-actions"><button id="buy" class="yellow wide">COMPRAR PELO WHATSAPP <span>↗</span></button><button id="add" class="add-button wide">ADICIONAR À SACOLA <span>＋</span></button></div>
<div class="detail-assurance"><span>✓</span> Atendimento direto e personalizado AJ IMPORTS</div>
</section>
</main>
